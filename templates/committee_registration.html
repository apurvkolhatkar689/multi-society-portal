<!doctype html>
<html>
  <head>
    <title>Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #333333; /* fallback for old browsers */
        background: -webkit-linear-gradient(
          to right,
          #a43931,
          #a2ab58,
          #333333
        ); /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(
          to right,
          #a43931,
          #a2ab58,
          #333333
        ); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
      }

      .container {
        background: #e0eafc;
        margin: 0 auto;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        margin: 0 auto; /* Centers the card within its Bootstrap column */
        text-align: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: 0.3s;
      }

      input:focus,
      select:focus {
        border-color: #414345;
        outline: none;
        box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
      }

      button {
        padding: 12px;
        background: #000000; /* fallback for old browsers */
        background: -webkit-linear-gradient(
          to right,
          #434343,
          #000000
        ); /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(
          to right,
          #434343,
          #000000
        ); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div
      class="d-flex justify-content-center align-items-center min-vh-100 px-3"
    >
      <div class="container">
        <!-- <h2>{{.Society}}</h2> -->
        <h3>Committee Registration</h3>
        <br />
        <form method="POST" action="/committee-register">
          <input
            type="text"
            name="full_name"
            placeholder="Full Name"
            required
          />

          <input
            type="tel"
            name="mobile"
            placeholder="Mobile Number"
            required
          />

          <input type="email" name="email" placeholder="Email" required />

          <input type="text" name="username" placeholder="Username" required />

          <input
            type="password"
            name="password"
            placeholder="Create Password"
            required
          />

          <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
          />

          <select name="designation" required>
            <option value="">Select Designation</option>
            <option>Chairman</option>
            <option>Secretary</option>
            <option>Treasurer</option>
            <option>Joint Secretary</option>
            <option>Committee Member</option>
          </select>

          <button type="submit">Register</button>
        </form>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
