<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Multi Tab Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #333333; /* fallback for old browsers */
        background: -webkit-linear-gradient(
          to right,
          #a43931,
          #a2ab58,
          #333333
        ); /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(
          to right,
          #a43931,
          #a2ab58,
          #333333
        ); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
      }

      /* Container */
      .box {
        background: #e0eafc;
        margin: 0 auto;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        margin: 0 auto; /* Centers the card within its Bootstrap column */
        text-align: center;
      }

      /* Tabs */
      .tabs {
        display: flex;
        margin-bottom: 15px;
      }

      .tab {
        flex: 1;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        background: #ddd;
      }

      .tab.active {
        background: #000000; /* fallback for old browsers */
        background: -webkit-linear-gradient(
          to right,
          #434343,
          #000000
        ); /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(
          to right,
          #434343,
          #000000
        ); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        color: white;
      }

      /* Forms */
      .form {
        display: none;
        flex-direction: column;
        gap: 15px;
      }

      .form form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .form.active {
        display: flex;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .form-grid input:last-child {
        grid-column: span 2;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: 0.3s;
      }

      button {
        padding: 12px;
        background: #000000; /* fallback for old browsers */
        background: -webkit-linear-gradient(
          to right,
          #434343,
          #000000
        ); /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(
          to right,
          #434343,
          #000000
        ); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>

  <body>
    <div
      class="d-flex justify-content-center align-items-center min-vh-100 px-3"
    >
      <div class="box">
        <h2>{{.Society}}</h2>
        {{if .Success}}
        <div
          style="
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
          "
        >
          {{.Success}}
        </div>
        {{end}}
        <!-- Tabs -->
        <div class="tabs">
          <div class="tab active" onclick="showTab(0)">Resident Login</div>
          <div class="tab" onclick="showTab(1)">Committee Login</div>
        </div>

        <!-- Tab 1 -->
        <div class="form active">
          <form method="POST" action="/resident-login">
            <input
              type="email"
              name="email"
              placeholder="Enter Email Address"
              required
            />

            <input
              type="tel"
              name="mobile"
              placeholder="Enter Mobile Number"
              required
            />

            <button type="submit">Login as Resident Member</button>
          </form>

          <div class="register-link">
            New Resident?
            <a href="/registration?society={{.Society}}">Register Here</a>
          </div>
        </div>

        <!-- Tab 2 -->
        <form class="form" method="POST" action="/committee-login">
          <input
            type="email"
            name="email"
            placeholder="Enter Email Address"
            required
          />

          <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
          />

          <button type="submit">Login as Committee Member</button>
        </form>
      </div>
    </div>

    <script>
      function showTab(index) {
        let tabs = document.querySelectorAll(".tab");
        let forms = document.querySelectorAll(".form");

        tabs.forEach((t, i) => {
          t.classList.remove("active");
          forms[i].classList.remove("active");
        });

        tabs[index].classList.add("active");
        forms[index].classList.add("active");
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
